<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Samuel Gathemia — Redirecting…</title>
    <script>
      // GitHub Pages SPA fallback (rafgraph/spa-github-pages technique).
      // Rewrites the URL into a query string so index.html can restore it.
      var segmentCount = 0; // user GitHub Pages site: routes start at /
      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
          l.pathname.split("/").slice(0, 1 + segmentCount).join("/") +
          "/?/" +
          l.pathname.slice(1).split("/").slice(segmentCount).join("/").replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
